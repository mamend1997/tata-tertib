name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Set the RAILWAY_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Set the RAILWAY_SERVICE repository variable."
            exit 1
          fi
          railway up --ci --service "$RAILWAY_SERVICE"
